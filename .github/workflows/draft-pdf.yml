# Builds the JOSS paper in paper/ on every push and attaches paper.pdf to the
# run (Actions → Draft PDF → Artifacts). The journal requires paper.md to
# live in the software repository; publications/joss in wizhut/kyori-research
# is the working copy it is kept in step with.
# Source: https://joss.readthedocs.io/en/latest/paper.html#github-action
name: Draft PDF
on: [push]

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
